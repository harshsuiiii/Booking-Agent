[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.3",
    "structlog>=24.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "cryptography>=42.0",
    "anthropic>=0.40",
    "tzdata>=2026.5",
    "pyjwt>=2.8",
    "aiosqlite>=0.20",
    "fakeredis>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pydantic[mypy]>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booking_agent = ["data/*.csv", "agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    "N818",   # domain exception names (SoldOut, FareExpired, ...) are public API
    "UP042",  # StrEnum changes str()/format() output of existing str+Enum classes
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # auth env must be set before app modules are imported

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
